<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WKS Wissen</title>
<meta name="description" content="Lionels Schulunterlagen als verlinkte Notizen, Karteikarten und Prüfungstermine.">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WKS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell" id="shell">
  <!-- Symbolleiste links (Desktop) bzw. unten (Handy) -->
  <nav class="ribbon" aria-label="Bereiche">
    <button type="button" data-pane="files" aria-label="Dateien" title="Dateien"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg><span>Dateien</span></button>
    <button type="button" data-pane="search" aria-label="Suche" title="Suche"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>Suche</span></button>
    <button type="button" data-view="graph" aria-label="Graph" title="Graph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12" cy="17" r="2.3"/><circle cx="19" cy="16" r="1.6"/><path d="M8 8.2l2.8 6.8M16.2 7.5l-3.2 7.4M8.2 6.8l7.6-.6M14.2 17l3.3-.7"/></svg><span>Graph</span></button>
    <button type="button" data-view="learn" aria-label="Lernen" title="Lernen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="13" height="13" rx="2"/><path d="M8 3.5h10.5A2 2 0 0 1 20.5 5.5V16"/></svg><span>Lernen <b class="badge" id="dueBadge" hidden></b></span></button>
    <button type="button" data-view="dates" aria-label="Termine" title="Termine"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Termine</span></button>
    <span class="ribbon-gap"></span>
    <button type="button" data-view="settings" class="ribbon-settings" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span>Mehr</span></button>
  </nav>

  <!-- Seitenleiste: Dateibaum, Suche oder Tags -->
  <aside class="side" id="side" aria-label="Seitenleiste">
    <div class="side-head">
      <div class="vault-name"><span id="vaultName">WKS</span><small id="vaultInfo"></small></div>
      <button type="button" class="icon-btn side-close" id="sideClose" aria-label="Seitenleiste schliessen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="side-tabs" role="tablist" aria-label="Seitenleiste">
      <button type="button" role="tab" data-pane="files" id="tab-files" aria-controls="pane-files">Dateien</button>
      <button type="button" role="tab" data-pane="search" id="tab-search" aria-controls="pane-search">Suche</button>
      <button type="button" role="tab" data-pane="tags" id="tab-tags" aria-controls="pane-tags">Tags</button>
    </div>
    <div class="pane" id="pane-files" role="tabpanel" aria-labelledby="tab-files"></div>
    <div class="pane" id="pane-search" role="tabpanel" aria-labelledby="tab-search" hidden>
      <label class="search" for="q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" type="search" placeholder="Suchen oder #tag" autocomplete="off" aria-label="In allen Notizen suchen" aria-describedby="qn"></label>
      <p class="pane-note" id="qn" role="status"></p>
      <div id="qres"></div>
    </div>
    <div class="pane" id="pane-tags" role="tabpanel" aria-labelledby="tab-tags" hidden></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Hauptbereich -->
  <div class="main">
    <header class="titlebar">
      <button type="button" class="icon-btn only-mobile" id="menuBtn" aria-label="Dateien öffnen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button type="button" class="icon-btn" id="backBtn" aria-label="Zurück" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <span class="sync" id="syncDot" title=""></span>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div class="toast-wrap"><div class="toast" id="toast" role="status" hidden></div></div>
<div class="sr-only" id="live" aria-live="polite"></div>
<script src="crypto.js"></script>
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
