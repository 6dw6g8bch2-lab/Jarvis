name: Budget-App veröffentlichen
on:
  push:
    branches: [main]
    paths: ["budget/**", "wks/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Budget-App liegt im Hauptordner, WKS Wissen unter /wks/
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -R budget/. _site/
          mkdir -p _site/wks
          cp -R wks/. _site/wks/
          rm -rf _site/wks/tools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
